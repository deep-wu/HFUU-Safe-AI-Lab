    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; color: #333; padding-top: 76px; background-color: #fcfdfd; }
        :root { --academic-blue: #003366; --accent-blue: #3498db; }
        .navbar { background-color: var(--academic-blue); box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08); }
        .navbar-brand { font-weight: 700; color: #fff !important; }
        .nav-link { color: rgba(255, 255, 255, 0.75) !important; font-weight: 500; margin: 0 4px; border-radius: 6px;}
        .nav-link:hover, .nav-link.active { color: #fff !important; background-color: rgba(255, 255, 255, 0.15); }
        
        /* 仿制图2的网格卡片样式 */
        .student-grid-card { border: 1px solid #eaeaea; border-radius: 0px; background: #fff; transition: all 0.3s; }
        .student-grid-card:hover { box-shadow: 0 5px 15px rgba(0,0,0,0.1); border-color: var(--accent-blue); }
        .student-photo { width: 100%; height: 260px; object-fit: cover; border-bottom: 1px solid #eaeaea; }
        .info-row { margin-bottom: 8px; font-size: 0.9rem; line-height: 1.5; display: flex; align-items: flex-start;}
        .info-label { font-weight: 600; color: #555; width: 75px; flex-shrink: 0; }
        .info-value { color: #333; word-break: break-all; }
        
        .page-header { text-align: center; margin-bottom: 40px; }
        .page-header h2 { font-weight: bold; color: var(--accent-blue); }
        .page-header span { font-size: 0.9rem; color: #888; }
        
        footer { background-color: var(--academic-blue); color: rgba(255, 255, 255, 0.8); padding: 20px 0; margin-top: 50px; border-top: 5px solid var(--accent-blue);}
    </style>
