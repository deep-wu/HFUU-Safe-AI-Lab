    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; color: #333; padding-top: 76px; background-color: #f8f9fa; }
        :root { --academic-blue: #003366; --accent-blue: #3498db; }
        
        .navbar { background-color: var(--academic-blue); box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08); }
        .navbar-brand { font-weight: 700; color: #fff !important; }
        .nav-link { color: rgba(255, 255, 255, 0.75) !important; font-weight: 500; margin: 0 4px; border-radius: 6px;}
        .nav-link:hover, .nav-link.active { color: #fff !important; background-color: rgba(255, 255, 255, 0.15); }
        
        .page-header { text-align: center; margin-bottom: 40px; }
        .page-header h2 { font-weight: 800; color: var(--academic-blue); letter-spacing: 1px; }
        .page-header span { font-size: 0.9rem; color: #888; }
        
        .transition-hover { transition: all 0.3s cubic-bezier(0.165, 0.84, 0.44, 1); }
        .transition-hover:hover { transform: translateY(-6px); box-shadow: 0 12px 30px rgba(0,0,0,0.08) !important; }
        
        .info-item { display: flex; align-items: flex-start; margin-bottom: 8px; font-size: 0.85rem; color: #555; }
        .info-icon { width: 22px; color: var(--accent-blue); flex-shrink: 0; padding-top: 3px; font-size: 0.9rem; text-align: center; margin-right: 6px;}
        .info-value { word-break: break-all; line-height: 1.5; }
        
        .research-tag { display: inline-block; background-color: rgba(52, 152, 219, 0.1); color: var(--accent-blue); font-size: 0.8rem; padding: 5px 12px; border-radius: 20px; font-weight: 600; }
        footer { background-color: var(--academic-blue); color: rgba(255, 255, 255, 0.8); padding: 20px 0; margin-top: 50px; border-top: 5px solid var(--accent-blue);}
