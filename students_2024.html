<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>在读研究生 | Secure AI Team</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; color: #333; padding-top: 76px; background-color: #f8f9fa; }
        :root { --academic-blue: #003366; --accent-blue: #3498db; }
        
        /* 导航栏 */
        .navbar { background-color: var(--academic-blue); box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08); }
        .navbar-brand { font-weight: 700; color: #fff !important; }
        .nav-link { color: rgba(255, 255, 255, 0.75) !important; font-weight: 500; margin: 0 4px; border-radius: 6px;}
        .nav-link:hover, .nav-link.active { color: #fff !important; background-color: rgba(255, 255, 255, 0.15); }
        
        /* 头部标题 */
        .page-header { text-align: center; margin-bottom: 40px; }
        .page-header h2 { font-weight: 800; color: var(--academic-blue); letter-spacing: 1px; }
        .page-header span { font-size: 0.9rem; color: #888; }
        
        /* 💎 高级微立体卡片样式 */
        .student-grid-card { 
            border: none; 
            border-radius: 16px; 
            background: #fff; 
            box-shadow: 0 8px 24px rgba(0,0,0,0.04); 
            transition: all 0.3s ease; 
            overflow: hidden; 
        }
        .student-grid-card:hover { 
            transform: translateY(-8px); 
            box-shadow: 0 15px 35px rgba(0,0,0,0.1); 
        }
        
        /* 照片区域：强制 3:4 证件照比例，优先人脸对齐 */
        .student-photo { 
            width: 100%; 
            height: auto; 
            aspect-ratio: 3 / 4; 
            object-fit: cover; 
            object-position: center 10%; 
            border-bottom: 1px solid #f0f0f0; 
        }
        
        /* 卡片内容排版 */
        .card-body { padding: 22px; }
        .student-name { font-weight: 700; font-size: 1.3rem; color: #2c3e50; margin-bottom: 4px; }
        .student-title { font-size: 0.85rem; color: #7f8c8d; margin-bottom: 18px; font-weight: 500; }
        
        /* 带图标的信息行 */
        .info-item { display: flex; align-items: flex-start; margin-bottom: 10px; font-size: 0.85rem; color: #555; }
        .info-icon { width: 24px; color: var(--accent-blue); flex-shrink: 0; padding-top: 2px; font-size: 0.9rem;}
        .info-value { word-break: break-all; line-height: 1.4; }
        
        /* 研究方向专属醒目标签 */
        .research-tag { 
            display: inline-block; 
            background-color: rgba(52, 152, 219, 0.1); 
            color: var(--accent-blue); 
            font-size: 0.8rem; 
            padding: 6px 14px; 
            border-radius: 20px; 
            font-weight: 600; 
            margin-top: 12px; 
        }

        footer { background-color: var(--academic-blue); color: rgba(255, 255, 255, 0.8); padding: 20px 0; margin-top: 50px; border-top: 5px solid var(--accent-blue);}
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg fixed-top navbar-dark">
        <div class="container">
            <a class="navbar-brand" href="index.html">🛡️ Secure AI Team</a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">返回首页</a></li>
                    <li class="nav-item"><a class="nav-link active" href="team.html">返回团队列表</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container py-5">
        
        <div class="page-header">
            <span>更新日期：2026年04月</span>
            <h2 class="mt-2">在读研究生</h2>
        </div>
        
        <div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 row-cols-lg-4 g-4">
            
            <div class="col">
                <div class="card student-grid-card h-100">
                    <img src="assets/images/stu_lumenghao.jpg" alt="鹿梦浩" class="student-photo">
                    <div class="card-body">
                        <div class="student-name">鹿梦浩</div>
                        <div class="student-title">硕士研究生</div>

                        <div class="info-item">
                            <span class="info-icon"><i class="fas fa-mobile-alt"></i></span>
                            <span class="info-value">17756728092</span>
                        </div>
                        <div class="info-item">
                            <span class="info-icon"><i class="fas fa-envelope"></i></span>
                            <span class="info-value">lumenghao@stu.hfuu.edu.cn</span>
                        </div>
                        <div class="info-item">
                            <span class="info-icon"><i class="fas fa-map-marker-alt"></i></span>
                            <span class="info-value">安徽省亳州市谯城区</span>
                        </div>
                        <div class="info-item">
                            <span class="info-icon"><i class="fas fa-star"></i></span>
                            <span class="info-value">打乒乓球</span>
                        </div>
                        
                        <div class="research-tag"><i class="fas fa-microscope me-1"></i> 骨架对抗</div>
                    </div>
                </div>
            </div>

            <div class="col">
                <div class="card student-grid-card h-100">
                    <img src="assets/images/stu_zhoujijian.jpg" alt="周基健" class="student-photo">
                    <div class="card-body">
                        <div class="student-name">周基健</div>
                        <div class="student-title">硕士研究生</div>

                        <div class="info-item">
                            <span class="info-icon"><i class="fas fa-mobile-alt"></i></span>
                            <span class="info-value">19856256289</span>
                        </div>
                        <div class="info-item">
                            <span class="info-icon"><i class="fas fa-envelope"></i></span>
                            <span class="info-value">zhoujijian@stu.hfuu.edu.cn</span>
                        </div>
                        <div class="info-item">
                            <span class="info-icon"><i class="fas fa-map-marker-alt"></i></span>
                            <span class="info-value">安徽省合肥市长丰县</span>
                        </div>
                        <div class="info-item">
                            <span class="info-icon"><i class="fas fa-star"></i></span>
                            <span class="info-value">打麻将，打掼蛋</span>
                        </div>
                        
                        <div class="research-tag"><i class="fas fa-microscope me-1"></i> 无源域适应</div>
                    </div>
                </div>
            </div>


        </div>
    </div>

    <footer class="text-center">
        <p class="small mb-0">&copy; 2026 Secure AI Team, Hefei University.</p>
    </footer>

</body>
</html>
